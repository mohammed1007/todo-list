<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo-app">
    <h1>Todo App</h1>
    <form id="todo-form">
      <label class="sr-only" for="todo-input">New task</label>
      <input id="todo-input" placeholder="What needs doing?" maxlength="300" autocomplete="off" required>
      <button class="add-button" type="submit">Add</button>
    </form>
    <div class="toolbar">
      <p id="edit-tip">Tip: double-click a todo to edit. Press Enter to save.</p>
      <nav aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>
    </div>
    <ul id="todo-list" aria-label="Tasks"></ul>
    <footer>
      <span id="items-left" role="status" aria-live="polite"></span>
      <div>
        <button id="clear-completed" type="button">Clear completed</button>
        <button id="clear-all" type="button">Clear all</button>
      </div>
    </footer>
  </main>
</body>
</html>
